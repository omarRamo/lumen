name: LUMEN · APK Android
on:
  push:
    branches: [main, 'iteration-**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lumen-android-${{ github.ref }}
  cancel-in-progress: false
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Capacitor 8 et AGP 8.13 exigent un JDK 21.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Choisir la voie sans afficher aucun secret
        run: node tools/android-release.cjs --check
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - run: npm ci
      # Chromium est le moteur de la WebView Android : c'est lui qui juge ici.
      - run: npx playwright install chromium
      - run: npm run verify
      - run: npx cap sync android
      - name: Construire l’APK
        run: node tools/android-release.cjs --assemble
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Prouver la signature avant le téléphone
        run: node tools/android-release.cjs --verify
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Conserver l’APK
        uses: actions/upload-artifact@v4
        with:
          name: LUMEN-android-${{ github.run_number }}
          path: android/app/build/outputs/apk/*/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Dire comment l’installer
        if: always()
        run: |
          {
            echo '## APK LUMEN'
            echo ''
            echo 'Télécharger **LUMEN-android-${{ github.run_number }}** dans les artefacts de ce run,'
            echo 'décompresser, puis sur le téléphone : ouvrir le fichier `.apk` et autoriser'
            echo 'l’installation depuis cette source. Ou, câble branché :'
            echo ''
            echo '```sh'
            echo 'adb install -r LUMEN.apk'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
